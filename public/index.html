<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZXZ PARENT MONITOR</title><link rel="stylesheet" href="/assets/style.css"></head>
<body><div id="toast"></div>
<section id="auth" class="auth-wrap"><div class="auth-card"><div class="brand-mark">ZXZ</div><p class="eyebrow">FAMILY DEVICE MANAGEMENT</p><h1>Parent Monitor</h1><p class="muted">Kelola perangkat keluarga dengan transparansi dan persetujuan.</p>
<div class="tabs"><button class="tab active" data-mode="login">Login</button><button class="tab" data-mode="register">Register</button></div>
<form id="authForm"><label>Username<input name="username" required minlength="3" autocomplete="username"></label><label>Password<input name="password" type="password" required minlength="10" autocomplete="current-password"></label><button class="primary full" type="submit" id="authSubmit">LOGIN</button></form><small class="muted">Password minimal 10 karakter.</small></div></section>
<div id="app" class="shell hidden"><aside class="sidebar"><div class="brand"><span class="brand-mark small">ZXZ</span><div><b>ZXZ PARENT</b><small>MONITOR V1.0</small></div></div><nav>
<button class="nav active" data-page="dashboard">▦ <span>Dashboard</span></button><button class="nav" data-page="devices">▣ <span>Device Manager</span></button><button class="nav" data-page="gallery">▧ <span>Gallery Manager</span></button><button class="nav" data-page="camera">◉ <span>Live Camera</span></button><button class="nav" data-page="activity">≋ <span>Activity Logs</span></button><button class="nav" data-page="telegram">➤ <span>Telegram Bot</span></button><button class="nav" data-page="settings">⚙ <span>Settings</span></button></nav><div class="side-bottom"><span class="online-dot"></span><small>Secure session</small><button id="logout" class="logout">Logout ↗</button></div></aside>
<main class="main"><header class="topbar"><button id="menu" class="mobile-menu">☰</button><div><p class="eyebrow">CONTROL CENTER</p><h2 id="pageTitle">Dashboard</h2></div><div class="user-pill"><span class="avatar">U</span><span id="username">User</span></div></header>
<div id="content" class="content"><div class="loading">Loading dashboard…</div></div></main></div>
<script src="/socket.io/socket.io.js"></script><script src="/assets/app.js"></script></body></html>
